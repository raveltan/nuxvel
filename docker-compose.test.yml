name: nuxvel-test

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: nuxvel
      POSTGRES_PASSWORD: nuxvel
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    ports:
      - "127.0.0.1:${NUXVEL_TEST_POSTGRES_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuxvel"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8
    command: ["redis-server", "--save", "", "--appendonly", "no", "--databases", "64"]
    ports:
      - "127.0.0.1:${NUXVEL_TEST_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:${NUXVEL_TEST_SMTP_PORT:-1026}:1025"
      - "127.0.0.1:${NUXVEL_TEST_MAILPIT_PORT:-8026}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 1s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=64", "-volume.max=32"]
    environment:
      AWS_ACCESS_KEY_ID: nuxvel
      AWS_SECRET_ACCESS_KEY: nuxvel-secret
    ports:
      - "127.0.0.1:${NUXVEL_TEST_STORAGE_PORT:-8334}:8333"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8333"]
      interval: 1s
      timeout: 3s
      retries: 30
