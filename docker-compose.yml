services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: nuxvel
      POSTGRES_PASSWORD: nuxvel
      POSTGRES_DB: nuxvel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuxvel"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    environment:
      AWS_ACCESS_KEY_ID: nuxvel
      AWS_SECRET_ACCESS_KEY: nuxvel-secret
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8333"]
      interval: 2s
      timeout: 3s
      retries: 30

  bugsink:
    image: bugsink/bugsink:2
    restart: unless-stopped
    environment:
      SECRET_KEY: nuxvel-local-bugsink-secret-key-not-for-production
      CREATE_SUPERUSER: admin@nuxvel.test:admin
      BASE_URL: http://localhost:8000
      PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - bugsinkdata:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://localhost:8000/health/ready\").raise_for_status()'"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  bugsinkdata:
  pgdata:
  redisdata:
  seaweedfsdata:
